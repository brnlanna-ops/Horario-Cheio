<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horário Cheio</title>
<style>
:root{--bg:#F3F5F2;--sf:#fff;--ink:#17262B;--mut:#5B6B70;--line:#D9E0DC;--red:#C2362B;--blue:#24577F;--ok:#1E7A52}
@media (prefers-color-scheme:dark){:root{--bg:#101A1E;--sf:#18262B;--ink:#EAF0EE;--mut:#9DB0B5;--line:#2B3E44;--red:#E5584C;--blue:#6FA6D1;--ok:#4CC08A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.pole{height:10px;background:repeating-linear-gradient(-45deg,var(--red) 0 12px,var(--sf) 12px 24px,var(--blue) 24px 36px,var(--sf) 36px 48px)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 48px}
h1,h2{line-height:1.15;margin:0}h1{font-size:1.9rem;padding:22px 0 4px}h2{font-size:1.1rem;margin-bottom:12px}
p.m{color:var(--mut);margin:4px 0}
section{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px}
button,input{font:inherit;color:inherit}
input{width:100%;margin:4px 0 10px;padding:11px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg)}
label{display:block;font-size:.9rem;color:var(--mut)}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.opt{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px;cursor:pointer}
.opt small{display:block;color:var(--mut)}
.opt[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.opt:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;margin-top:12px}.slots .opt,.days .opt{text-align:center}
.days{display:flex;gap:8px;overflow-x:auto}.days .opt{flex:0 0 auto;min-width:70px}
.cta{width:100%;padding:14px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:700;cursor:pointer}
.ghost{background:none;border:1.5px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-of-type{border-top:0}.row .i{flex:1;min-width:140px}.row small{display:block;color:var(--mut)}
.link{word-break:break-all;background:var(--bg);padding:10px;border-radius:8px;border:1.5px dashed var(--line)}
a.wa{display:inline-block;margin-top:8px;padding:12px 16px;border-radius:10px;background:var(--ok);color:#fff;font-weight:700;text-decoration:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="pole"></div>
<div class="wrap"><main id="app"><p class="m">Carregando…</p></main></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// 1) Cole aqui a URL e a chave "anon" do seu projeto Supabase (Settings > API).
const SB_URL='https://grkjxoewhovblhwbagud.supabase.co', SB_KEY='sb_publishable_n1kVnq_yWHdp-P0p4Fy7sQ_D5zxOqdQ';
if(SB_URL.startsWith('COLE')){document.getElementById('app').innerHTML='<h1>Falta configurar</h1><p class="m">Abra o index.html em um editor de texto e cole a URL e a chave anon do Supabase nas duas constantes SB_URL e SB_KEY, no começo do script.</p>';throw new Error('Supabase não configurado')}
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s), app=$('#app');
const pad=n=>String(n).padStart(2,'0'), iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
const money=v=>'R$ '+Number(v).toFixed(2).replace('.',',');
const br=d=>d.split('-').reverse().join('/');
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
const TIMES=[];for(let h=9;h<18;h++){TIMES.push(pad(h)+':00',pad(h)+':30')}
const DAYS=[];for(let d=new Date();DAYS.length<7;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)){if(d.getDay())DAYS.push({iso:iso(d),wd:WD[d.getDay()],n:d.getDate()})}
const chips=cur=>`<div class="days">${DAYS.map(d=>`<button class="opt" data-k="day" data-v="${d.iso}" aria-pressed="${cur===d.iso}"><small>${d.wd}</small><b>${d.n}</b></button>`).join('')}</div>`;
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';setTimeout(()=>t.className='',2400)}

const slug=new URLSearchParams(location.search).get('loja');
slug?clientApp(slug):ownerApp();

/* ---------- Página pública do cliente (?loja=nome-da-barbearia) ---------- */
async function clientApp(slug){
  const {data:shop}=await sb.from('shops').select().eq('slug',slug).maybeSingle();
  if(!shop){app.innerHTML='<h1>Página não encontrada</h1><p class="m">Confira o link com a barbearia.</p>';return}
  document.title=shop.name;
  const {data:ativo}=await sb.rpc('shop_is_active',{s:shop.id});
  if(!ativo){const w=(shop.whatsapp||'').replace(/\D/g,'');
    app.innerHTML=`<h1>${esc(shop.name)}</h1><p class="m">Agendamento online indisponível no momento.${w?' Fale direto com a barbearia:':''}</p>${w?`<a class="wa" href="https://wa.me/55${w}" target="_blank" rel="noopener">Chamar no WhatsApp</a>`:''}`;return}
  const [{data:svcs=[]},{data:pros=[]}]=await Promise.all([sb.from('services').select().eq('shop_id',shop.id).order('name'),sb.from('pros').select().eq('shop_id',shop.id).order('name')]);
  const st={svc:null,pro:'any',day:DAYS[0].iso,time:null,taken:[],nm:'',ph:''};
  const cands=()=>(st.pro==='any'?pros:pros.filter(p=>p.id===st.pro)).filter(p=>!st.taken.some(k=>k.pro_id===p.id&&k.time===st.time));
  const free=t=>{const n=new Date();if(st.day===iso(n)&&t<=pad(n.getHours())+':'+pad(n.getMinutes()))return false;
    return (st.pro==='any'?pros:pros.filter(p=>p.id===st.pro)).some(p=>!st.taken.some(k=>k.pro_id===p.id&&k.time===t))};
  async function load(){const {data}=await sb.rpc('taken_slots',{p_shop:shop.id,p_day:st.day});st.taken=data||[];draw()}
  function draw(){
    app.innerHTML=`<h1>${esc(shop.name)}</h1><p class="m">Escolha o serviço e o horário.</p>
    <section><h2>1. Qual serviço?</h2><div class="grid">${svcs.map(s=>`<button class="opt" data-k="svc" data-v="${s.id}" aria-pressed="${st.svc===s.id}"><b>${esc(s.name)}</b><small>${money(s.price)} · ${s.minutes} min</small></button>`).join('')||'<p class="m">Nenhum serviço cadastrado ainda.</p>'}</div></section>
    <section><h2>2. Com quem?</h2><div class="grid"><button class="opt" data-k="pro" data-v="any" aria-pressed="${st.pro==='any'}"><b>Sem preferência</b></button>${pros.map(p=>`<button class="opt" data-k="pro" data-v="${p.id}" aria-pressed="${st.pro===p.id}"><b>${esc(p.name)}</b></button>`).join('')}</div></section>
    <section><h2>3. Dia e horário</h2>${chips(st.day)}<div class="slots">${TIMES.map(t=>`<button class="opt" data-k="time" data-v="${t}" aria-pressed="${st.time===t}" ${free(t)?'':'disabled'}>${t}</button>`).join('')}</div></section>
    <section><h2>4. Seus dados</h2><label>Nome<input id="nm" value="${esc(st.nm)}" autocomplete="name"></label><label>WhatsApp<input id="ph" value="${esc(st.ph)}" inputmode="tel" autocomplete="tel" placeholder="(31) 99999-9999"></label><button class="cta" data-go>Reservar horário</button></section>`}
  app.onclick=async e=>{
    const b=e.target.closest('button');if(!b)return;
    if($('#nm')){st.nm=$('#nm').value;st.ph=$('#ph').value}
    if(b.dataset.k){st[b.dataset.k]=b.dataset.v;
      if(b.dataset.k==='svc')st.svc=b.dataset.v;
      if(b.dataset.k!=='time'&&b.dataset.k!=='svc')st.time=null;
      return b.dataset.k==='day'?load():draw()}
    if(b.hasAttribute('data-go'))book()};
  async function book(){
    const svc=svcs.find(s=>s.id===st.svc),nm=st.nm.trim(),ph=st.ph.trim();
    if(!svc||!st.time||!nm||ph.replace(/\D/g,'').length<10)return toast('Escolha serviço e horário e informe nome e WhatsApp com DDD');
    for(const p of cands()){
      const {error}=await sb.from('bookings').insert({shop_id:shop.id,pro_id:p.id,service_name:svc.name,price:svc.price,day:st.day,time:st.time,client_name:nm,client_phone:ph});
      if(!error)return done(p,svc,nm);
      if(error.code!=='23505')return toast('Não foi possível reservar. Tente de novo.')}
    toast('Esse horário acabou de ser ocupado');load()}
  function done(p,svc,nm){
    const msg=encodeURIComponent(`Olá! Agendei ${svc.name} com ${p.name} em ${br(st.day)} às ${st.time}. Meu nome: ${nm}`);
    const num=(shop.whatsapp||'').replace(/\D/g,'');
    app.innerHTML=`<h1>Horário reservado</h1><section><p><b>${esc(svc.name)}</b> com ${esc(p.name)}<br>${br(st.day)} às ${st.time} · ${money(svc.price)}</p>${num?`<a class="wa" href="https://wa.me/55${num}?text=${msg}" target="_blank" rel="noopener">Avisar a barbearia no WhatsApp</a>`:''}</section>`}
  load()}

/* ---------- Área do dono (sem ?loja=) ---------- */
async function ownerApp(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return authView();
  const {data:shop}=await sb.from('shops').select().eq('owner',session.user.id).maybeSingle();
  shop?panel(shop):shopView()}

function authView(){
  app.innerHTML=`<h1>Horário Cheio</h1><p class="m">Entre para gerenciar a agenda da sua barbearia ou salão.</p>
  <section><label>E-mail<input id="em" type="email" autocomplete="email"></label><label>Senha (mínimo 6 caracteres)<input id="pw" type="password" autocomplete="current-password"></label>
  <div class="two"><button class="cta" id="in">Entrar</button><button class="ghost" id="up">Criar conta</button></div></section>`;
  const cred=()=>({email:$('#em').value.trim(),password:$('#pw').value});
  $('#in').onclick=async()=>{const {error}=await sb.auth.signInWithPassword(cred());error?toast('E-mail ou senha incorretos'):ownerApp()};
  $('#up').onclick=async()=>{const {data,error}=await sb.auth.signUp(cred());
    if(error)return toast(error.message);
    data.session?ownerApp():toast('Conta criada. Confirme pelo e-mail e entre.')}}

function shopView(){
  app.innerHTML=`<h1>Crie sua página</h1><p class="m">Seus clientes vão agendar por um link só seu.</p>
  <section><label>Nome do negócio<input id="sn"></label><label>Endereço do link (letras minúsculas, números e hífen)<input id="sl" placeholder="barbearia-do-joao"></label><label>WhatsApp com DDD<input id="sw" inputmode="tel"></label><button class="cta" id="mk">Criar página</button></section>`;
  $('#mk').onclick=async()=>{
    const {error}=await sb.from('shops').insert({name:$('#sn').value.trim(),slug:$('#sl').value.trim(),whatsapp:$('#sw').value.trim()});
    error?toast(error.code==='23505'?'Esse endereço já está em uso':('Erro: '+error.message+' ('+(error.code||'sem código')+')')):ownerApp()}}

function billingHtml(b){
  if(!b)return '';
  const t={active:'Assinatura ativa. Obrigado!',
    overdue:'Pagamento em atraso. Sua página de agendamento está pausada até o pagamento.',
    canceled:'Assinatura cancelada. Sua página de agendamento está pausada.',
    trial:`Teste grátis até ${br(b.trial_ends)}. Depois, ${money(b.price)} por mês.`}[b.status];
  if(b.status==='active')return `<section><h2>Sua assinatura</h2><p class="m">${t}</p></section>`;
  return `<section><h2>Sua assinatura</h2><p class="m">${t}</p>`+(b.invoice_url
    ?`<a class="wa" href="${esc(b.invoice_url)}" target="_blank" rel="noopener">Abrir fatura</a>`
    :`<label>CPF ou CNPJ para a cobrança<input id="doc" inputmode="numeric"></label><button class="cta" id="sub">Assinar por ${money(b.price)}/mês</button>`)+`</section>`}
async function subscribe(){
  const {data,error}=await sb.functions.invoke('criar-assinatura',{body:{cpfCnpj:$('#doc').value}});
  if(error||data?.error){let m=data?.error;try{m=m||(await error.context.json()).error}catch(_){}return toast(m||'Não foi possível gerar a cobrança')}
  data.url?location.href=data.url:toast('Cobrança criada. Atualize a página.')}

async function panel(shop){
  let day=DAYS[0].iso;
  const link=location.origin+location.pathname+'?loja='+shop.slug;
  async function draw(){
    const [{data:bks=[]},{data:svcs=[]},{data:pros=[]}]=await Promise.all([
      sb.from('bookings').select('*,pros(name)').eq('shop_id',shop.id).eq('day',day).order('time'),
      sb.from('services').select().eq('shop_id',shop.id).order('name'),
      sb.from('pros').select().eq('shop_id',shop.id).order('name')]);
    const {data:bill}=await sb.from('billing').select().eq('shop_id',shop.id).maybeSingle();
    const tot=bks.reduce((a,b)=>a+Number(b.price),0);
    app.innerHTML=`<h1>${esc(shop.name)}</h1>
    <section><h2>Link para seus clientes</h2><div class="link">${esc(link)}</div><p><button class="ghost" id="cp">Copiar link</button> <button class="ghost" id="out">Sair</button></p></section>
    ${billingHtml(bill)}
    <section><h2>Agenda</h2>${chips(day)}<p class="m"><b>${bks.length}</b> agendamentos · previsto <b>${money(tot)}</b></p>
    ${bks.map(b=>`<div class="row"><b>${b.time}</b><div class="i"><b>${esc(b.client_name)}</b><small>${esc(b.service_name)} · ${esc(b.pros?.name)} · ${money(b.price)} · ${esc(b.client_phone)}</small></div><button class="ghost" data-del="bookings" data-id="${b.id}">Cancelar</button></div>`).join('')||'<p class="m">Nenhum agendamento neste dia.</p>'}</section>
    <section><h2>Serviços</h2>${svcs.map(s=>`<div class="row"><div class="i"><b>${esc(s.name)}</b><small>${s.minutes} min · ${money(s.price)}</small></div><button class="ghost" data-del="services" data-id="${s.id}">Remover</button></div>`).join('')}
    <div class="two"><label>Nome<input id="an"></label><label>Preço (R$)<input id="ap" inputmode="decimal"></label></div><button class="ghost" id="as">Adicionar serviço</button></section>
    <section><h2>Profissionais</h2>${pros.map(p=>`<div class="row"><div class="i"><b>${esc(p.name)}</b></div><button class="ghost" data-del="pros" data-id="${p.id}">Remover</button></div>`).join('')||'<p class="m">Adicione ao menos um profissional para receber reservas.</p>'}
    <label>Nome<input id="pn"></label><button class="ghost" id="ap2">Adicionar profissional</button></section>`;
    $('#cp').onclick=()=>navigator.clipboard.writeText(link).then(()=>toast('Link copiado'));
    $('#out').onclick=async()=>{await sb.auth.signOut();ownerApp()};
    $('#as').onclick=async()=>{const p=parseFloat($('#ap').value.replace(',','.')),n=$('#an').value.trim();
      if(!n||!(p>0))return toast('Informe nome e preço');
      const {error}=await sb.from('services').insert({shop_id:shop.id,name:n,price:p});error?toast('Erro ao salvar'):draw()};
    $('#ap2').onclick=async()=>{const n=$('#pn').value.trim();if(!n)return toast('Informe o nome');
      const {error}=await sb.from('pros').insert({shop_id:shop.id,name:n});error?toast('Erro ao salvar'):draw()}}
  app.onclick=async e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.id==='sub')return subscribe();
    if(b.dataset.k==='day'){day=b.dataset.v;return draw()}
    if(b.dataset.del&&confirm('Confirmar?')){await sb.from(b.dataset.del).delete().eq('id',b.dataset.id);draw()}};
  draw()}
</script>
</body>
</html>
